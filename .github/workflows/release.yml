name: "Release (UI + prebuilt bridge)"

# Ships UI/manager changes using the pre-built bridge binary committed at
# docker/mqttmanager-build/nspm_mqttmanager — no C++ compilation, no Conan.
# The binary is the known-good v1.0.2 bridge (byte-stable behavior the panels
# already run). The Go bridge (docker/nspanel-core-bridge) replaces it when
# its integration test passes.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Determine image name
        id: image
        run: |
          echo "name=ghcr.io/alexxbody/nspanel-core-amd64" >> $GITHUB_OUTPUT

      - name: Update version strings
        shell: bash
        run: |
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/templates/about.html
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/templates/modals/initial_setup/welcome.html
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/views.py

      - name: Make bridge binary executable
        run: chmod +x docker/mqttmanager-build/nspm_mqttmanager

      - name: Build and push amd64 image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: amd64
          image: ${{ steps.image.outputs.name }}
          image-tags: |
            ${{ github.ref_name }}
            latest
          version: ${{ github.ref_name }}
          push: "true"
          context: docker
          build-args: |
            no_mqttmanager_build=yes
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: "false"

  bump-addon-version:
    name: Bump add-on version in main
    needs: publish
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update stable version
        run: |
          sed -i "s|^version: .*|version: ${{ github.ref_name }}|g" docker/config.yaml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Bump Home Assistant add-on version to ${{ github.ref_name }}
          branch: "main"
