name: "Publish (NSPanel Core)"

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Determine image name
        id: image
        run: |
          echo "name=ghcr.io/alexxbody/nspanel-core-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Update version strings
        shell: bash
        run: |
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/templates/about.html
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/templates/modals/initial_setup/welcome.html
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/views.py

      - name: Build and push ${{ matrix.arch }} image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ steps.image.outputs.name }}
          image-tags: |
            ${{ github.ref_name }}
            latest
          version: ${{ github.ref_name }}
          push: "true"
          context: docker
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: "false"

  bump-addon-version:
    name: Bump add-on version in main
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update stable version
        run: |
          sed -i "s|^version: .*|version: ${{ github.ref_name }}|g" docker/config.yaml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Bump Home Assistant add-on version to ${{ github.ref_name }}
          branch: "main"
