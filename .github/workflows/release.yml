name: "Publish (NSPanel Manager HA)"

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [i386, amd64, armhf, armv7, aarch64]
    steps:
      - name: Determine image name
        shell: bash
        id: image
        run: |
          if [ "${{ github.event.release.prerelease }}" == "true" ]; then
            echo "image=ghcr.io/alexxbody/nspanelmanager-ha-beta-{arch}" >> $GITHUB_OUTPUT
          else
            echo "image=ghcr.io/alexxbody/nspanelmanager-ha-{arch}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Update version strings
        shell: bash
        run: |
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/templates/about.html
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/templates/modals/initial_setup/welcome.html
          sed -i 's/%version%/${{ github.ref_name }}/g' docker/web/nspanelmanager/web/views.py
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        uses: home-assistant/builder@2025.03.0
        with:
          args: |
            --${{ matrix.arch }} \
            --target docker \
            --image ${{ steps.image.outputs.image }} \
            --version ${{ github.ref_name }} \
            --release ${{ github.ref_name }}

  bump-addon-version:
    name: Bump add-on version in main
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update stable version
        if: ${{ github.event.release.prerelease != true }}
        run: |
          sed -i "s|^version: .*|version: ${{ github.ref_name }}|g" docker/config.yaml
      - name: Update beta version
        if: ${{ github.event.release.prerelease == true }}
        run: |
          sed -i "s|^version: .*|version: ${{ github.ref_name }}|g" docker-beta/config.yaml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Bump Home Assistant add-on version to ${{ github.ref_name }}
          branch: "main"
