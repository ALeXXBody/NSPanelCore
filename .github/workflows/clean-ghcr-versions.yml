name: "Clean old GHCR image versions"

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  clean:
    name: Clean ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [nspanel-core-amd64, nspanel-core-aarch64]
    steps:
      - name: Delete versions not tagged v1.0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.pkg }}
        run: |
          ids=$(gh api "/user/packages/container/$PKG/versions" --paginate \
            --jq '.[] | select((.metadata.container.tags // [] | map(select(. == "v1.0.2")) | length) == 0) | .id')
          if [ -z "$ids" ]; then
            echo "No removable versions found in $PKG (keeping v1.0.2/latest)"
            exit 0
          fi
          for id in $ids; do
            echo "Deleting $PKG version $id"
            gh api -X DELETE "/user/packages/container/$PKG/versions/$id"
          done
          echo "Remaining versions:"
          gh api "/user/packages/container/$PKG/versions" --jq '.[] | {id, tags: .metadata.container.tags}'
