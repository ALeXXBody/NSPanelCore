name: "Delete GHCR packages (temporary)"

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [nspanel-core-amd64, nspanel-core-aarch64]
    steps:
      - name: Delete package ${{ matrix.pkg }} entirely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "/user/packages/container/${{ matrix.pkg }}" && echo "Package deleted" || echo "Delete failed or already gone"
