name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test deps
        run: pip install pytest pytest-asyncio pytest-homeassistant-custom-component
      - name: Contract + unit suite (v1 + v2 + firmware audits)
        run: pytest tests/ -q

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32dev_idf5]  # native_idf5 joins when its build stabilizes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/build_cache
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Set up PlatformIO
        run: pip install platformio
      - name: Build firmware + filesystem image
        working-directory: firmware
        run: |
          pio run -e ${{ matrix.env }}
          pio run -e ${{ matrix.env }} -t buildfs

  release:
    needs: [tests, firmware]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish evergreen firmware release
        run: bash firmware/publish.sh "${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
