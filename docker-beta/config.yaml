name: "NSPanel Core BETA"
description: "Development builds of NSPanel Core - may be unstable"
version: 2.1.9-ha.beta.1
image: ghcr.io/alexxbody/nspanel-core-beta-{arch}
slug: "nspanel-core-beta"
url: "https://github.com/ALeXXBody/NSPanelCore"
webui: http://[HOST]:[PORT:8000]/
panel_icon: mdi:fit-to-screen
ports:
  8000/tcp: 8000
environment:
  IS_HOME_ASSISTANT_ADDON: "true"
init: false
homeassistant_api: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
