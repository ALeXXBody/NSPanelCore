name: "NSPanel Manager HA BETA"
description: "Development builds of the NSPanel Manager HA fork - may be unstable"
version: 2.1.9-ha.beta.1
image: ghcr.io/alexxbody/nspanelmanager-ha-beta-{arch}
slug: "nspanelmanager-ha-beta"
url: "https://github.com/ALeXXBody/NSPanelManager-HA"
webui: http://[HOST]:[PORT:8000]/
panel_icon: mdi:fit-to-screen
ports:
  8000/tcp: 8000
environment:
  IS_HOME_ASSISTANT_ADDON: "true"
init: false
homeassistant_api: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
