; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@5.4.0
board = esp32dev
framework = arduinomonitor_speed = 115200
upload_speed = 921600
lib_deps = 
	bblanchon/ArduinoJson@^7.0.4
	knolleary/PubSubClient@^2.8
	ottowinter/ESPAsyncWebServer-esphome@^3.1.0
monitor_raw = 0
monitor_filters = esp32_exception_decoder
extra_scripts = 
	pre:extra_script.py
	./littlefsbuilder.py
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags = 
	-DESP32=1
	-DARDUINO_ARCH_ESP32=1
	-DBOARD_HAS_PSRAM
	-std=c++17
	-std=gnu++17
build_unflags = 
	-std=gnu++11

; IDF 5.5 generation build (app matches the upstream IDF 5.5 bootloader —
; the IDF 4.4 app under the 5.5 bootloader was unstable on weak power).
[env:esp32dev_idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	bblanchon/ArduinoJson@^7.0.4
	knolleary/PubSubClient@^2.8
	esp32async/ESPAsyncWebServer@^3.7.0
	esp32async/AsyncTCP@^3.4.0
monitor_raw = 0
monitor_filters = esp32_exception_decoder
extra_scripts = 
	pre:extra_script.py
	./littlefsbuilder.py
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags = 
	-DESP32=1
	-DARDUINO_ARCH_ESP32=1
	-DBOARD_HAS_PSRAM
	-std=c++17
	-std=gnu++17
build_unflags = 
	-std=gnu++11
