{% extends 'base.html' %}

{% block content %}
<h2 class="title is-4">Settings</h2>
<p class="subtitle is-6">Choose a section:</p>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    {% for sp in subpages %}
    <a href="/nspanel_core/settings/{{ sp.slug }}"
       class="card bg-base-200 hover:bg-base-300 transition-colors shadow-md">
        <div class="card-body">
            <h3 class="card-title text-base">{{ sp.title }}</h3>
            <p class="text-sm text-base-content/70">{{ sp.desc }}</p>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
