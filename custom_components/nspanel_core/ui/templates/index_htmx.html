{% extends 'base.html' %}

{% block head %}

<script src="/nspanel_core/static/index_htmx.js?version={{ static_ver }}"></script>
<script>
/* P311: the shell is public; the panel data arrives via authed htmx.
 * Wait for auth bootstrap/session when possible, but always trigger — the
 * htmx 401 handler will retry after establishing auth in the HA app. */
(function waitForAuth(i) {
  if (typeof htmx === "undefined") { setTimeout(function(){waitForAuth(i);},300); return; }
  var ready = false;
  try { ready = !!(window._nspanelSessionEstablished || window._nspanelBootstrapDone || (typeof nspanelGetToken === "function" && nspanelGetToken())); } catch (e) {}
  if (ready || i >= 10) {
    try { htmx.trigger(document.getElementById("nspanels_section"), "register_request"); } catch (e) {}
    return;
  }
  setTimeout(function () { waitForAuth(i + 1); }, 300);
})(0);
</script>
<link rel="stylesheet" type="text/css" href="/nspanel_core/static/index.css?version={{ static_ver }}">
{% if manager_address == "" %}<script src="/nspanel_core/static/initial_setup.js?version={{ static_ver }}"></script>{% endif %}
{% endblock %}

{% block content %}

<span class="hidden" id="temperature_unit">{{ temperature_unit }}</span>
<div class="flex flex-wrap justify-between items-center">
  <div class="flex justify-between items-center">
    <span class="font-medium text-2xl me-2">NSPanels</span>
  </div>
</div>
<div>
    {% include 'index_htmx_nspanels_section.html' %}
</div>
<div class="mt-4" id="nsp_discovery_box"></div>
<script>
function nspanelDiscoveredRow(p) {
  var div = document.createElement("div");
  div.className = "flex flex-wrap items-center gap-2 py-1 border-b border-base-300";
  var label = document.createElement("span");
  label.className = "text-sm";
  label.textContent = (p.hostname || "(unnamed panel)") + " — " + p.address +
    " · fw " + (p.version || "?") + " · MQTT " + (p.mqtt || "?");
  div.appendChild(label);
  var acc = document.createElement("button");
  acc.className = "btn btn-sm btn-success";
  acc.textContent = "Accept";
  acc.onclick = function () { nspanelDiscoveredAction("accept", p, acc); };
  var den = document.createElement("button");
  den.className = "btn btn-sm btn-ghost";
  den.textContent = "Decline";
  den.onclick = function () { nspanelDiscoveredAction("deny", p, den); };
  div.appendChild(acc); div.appendChild(den);
  return div;
}
/* P311: DISCOVERY IS AUTOMATIC — the manager's background browser keeps the
 * live list; this box renders itself only when unprovisioned panels are
 * found. Accept/decline stays the user's decision; seeing is not. */
var _nsp_disc_timer = null;
function nspanelDiscoveredAction(action, p, btn) {
  if (btn) btn.disabled = true;
  var box = document.getElementById("nsp_discovery_msg");
  if (box) { box.textContent = action === "accept"
    ? "Sending the MQTT settings to " + (p.hostname || p.address) + " …"
    : "Declining " + (p.hostname || p.address) + " …"; }
  nspanelFetch("/nspanel_core/api/discovered_panel", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "action=" + action + "&address=" + encodeURIComponent(p.address) + "&hostname=" + encodeURIComponent(p.hostname || ""),
  }).then(function (r) { return r.text().then(function (t) { return [r.ok, t]; }); }).then(function (res) {
    if (box) box.textContent = res[1] || (res[0] ? "Done." : "Failed.");
    if (!res[0]) { if (btn) btn.disabled = false; return; }
    if (action === "accept") {
      // the panel saves, reboots into the broker and registers — refresh
      try { var sec = document.getElementById("nspanels_section"); if (sec) htmx.trigger(sec, "register_request"); } catch (e) {}
      setTimeout(function () {
        try { var s2 = document.getElementById("nspanels_section"); if (s2) htmx.trigger(s2, "register_request"); } catch (e) {}
        nspanelRefreshDiscovery();
      }, 20000);
    } else {
      nspanelRefreshDiscovery();
    }
  }).catch(function () { if (btn) btn.disabled = false; });
}
function nspanelRefreshDiscovery() {
  nspanelFetch("/nspanel_core/api/discovered_panels", { credentials: "same-origin" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var box = document.getElementById("nsp_discovery_box");
      if (!box) return;
      var panels = d.panels || [];
      if (!panels.length) { box.innerHTML = ""; return; }
      var card = document.createElement("div");
      card.className = "p-3 rounded-md bg-base-100 shadow";
      var title = document.createElement("div");
      title.className = "text-sm font-medium mb-1";
      title.textContent = "New NSPanel" + (panels.length > 1 ? "s" : "") + " found on the network:";
      card.appendChild(title);
      var msg = document.createElement("div");
      msg.id = "nsp_discovery_msg";
      msg.className = "text-sm opacity-80 mb-1";
      card.appendChild(msg);
      panels.forEach(function (p) { card.appendChild(nspanelDiscoveredRow(p)); });
      box.innerHTML = "";
      box.appendChild(card);
    })
    .catch(function () {});
}
(function () {
  var boot = function () {
    // P311: the FIRST discovery pull must ride an established credential —
    // before the auth bootstrap lands it would fire unauthenticated and
    // fail silently. Wait (bounded) for the session, then start the loop.
    var tries = 0;
    var start = function () {
      nspanelRefreshDiscovery();
      if (_nsp_disc_timer) clearInterval(_nsp_disc_timer);
      _nsp_disc_timer = setInterval(nspanelRefreshDiscovery, 20000);
    };
    var wait = function () {
      tries++;
      var authed = false;
      try {
        authed = !!(window._nspanelBootstrapDone || window._nspanelSessionEstablished ||
                    (typeof nspanelGetToken === "function" && nspanelGetToken()));
      } catch (e) {}
      if (authed || tries >= 20) { start(); return; }
      setTimeout(wait, 500);
    };
    wait();
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
{% endblock %}
