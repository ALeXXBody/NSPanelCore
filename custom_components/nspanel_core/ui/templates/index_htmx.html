{% extends 'base.html' %}

{% block head %}

<script src="/nspanel_core/static/index_htmx.js?version={{ static_ver }}"></script>
<script>
/* P311: the shell is public; the panel data arrives via the AUTHED htmx
 * pull once the login token is available (the HA app delivers it async).
 * Without a token the pull is deferred — htmx answers 401 otherwise. */
(function waitForToken(i) {
  var t = (typeof nspanelGetToken === "function") ? nspanelGetToken() : "";
  if (typeof htmx === "undefined") { setTimeout(function(){waitForToken(i);},400); return; }
  if (t || i >= 40) {
    try { htmx.trigger(document.getElementById("nspanels_section"), "register_request"); } catch (e) {}
    return;
  }
  setTimeout(function () { waitForToken(i + 1); }, 400);
})(0);
</script>
<link rel="stylesheet" type="text/css" href="/nspanel_core/static/index.css?version={{ static_ver }}">
{% if manager_address == "" %}<script src="/nspanel_core/static/initial_setup.js?version={{ static_ver }}"></script>{% endif %}
{% endblock %}

{% block content %}

<span class="hidden" id="temperature_unit">{{ temperature_unit }}</span>
<div class="flex flex-wrap justify-between items-center">
  <div class="flex justify-between items-center">
    <span class="font-medium text-2xl me-2">NSPanels</span>
  </div>
</div>
<div>
    {% include 'index_htmx_nspanels_section.html' %}
</div>
{% endblock %}
