{% extends 'base.html' %}

{% block head %}

<script src="/nspanel_core/static/index_htmx.js?version={{ static_ver }}"></script>
<script>
/* P311: the shell is public; the panel data arrives via authed htmx.
 * Wait for auth bootstrap/session when possible, but always trigger — the
 * htmx 401 handler will retry after establishing auth in the HA app. */
(function waitForAuth(i) {
  if (typeof htmx === "undefined") { setTimeout(function(){waitForAuth(i);},300); return; }
  var ready = false;
  try { ready = !!(window._nspanelSessionEstablished || window._nspanelBootstrapDone || (typeof nspanelGetToken === "function" && nspanelGetToken())); } catch (e) {}
  if (ready || i >= 10) {
    try { htmx.trigger(document.getElementById("nspanels_section"), "register_request"); } catch (e) {}
    return;
  }
  setTimeout(function () { waitForAuth(i + 1); }, 300);
})(0);
</script>
<link rel="stylesheet" type="text/css" href="/nspanel_core/static/index.css?version={{ static_ver }}">
{% if manager_address == "" %}<script src="/nspanel_core/static/initial_setup.js?version={{ static_ver }}"></script>{% endif %}
{% endblock %}

{% block content %}

<span class="hidden" id="temperature_unit">{{ temperature_unit }}</span>
<div class="flex flex-wrap justify-between items-center">
  <div class="flex justify-between items-center">
    <span class="font-medium text-2xl me-2">NSPanels</span>
  </div>
</div>
<div>
    {% include 'index_htmx_nspanels_section.html' %}
</div>
{% endblock %}
