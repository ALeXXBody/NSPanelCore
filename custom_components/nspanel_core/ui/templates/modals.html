<!-- Save new firmware modal -->
<dialog id="upload_firmware_modal" class="modal">
    <div class="modal-box">
        <!-- Upper right close button -->
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <form method="POST" action="/nspanel_core/save_new_firmware" enctype="multipart/form-data" data-authed>
        


        <h3 class="text-lg font-semibold mb-2">Upload firmware</h3>
        {% include 'components/alert.html' %}

        <!-- Firmware file type -->
        <div class="mt-4">
          <label for="firmware_type" class="block mb-2 text-sm font-medium">Board model</label>
          <div class="flex flex-row-reverse">
            <select name="model" id="model" class="rounded-none bg-base-300 border-neutral rounded-e-md border border-l-0 focus:ring-0 focus:border-accent block flex-1 min-w-0 w-full text-sm p-2.5 peer/room_id">
              <option value="sonoff">Sonoff original NSPanel</option>
              <option value="custom">Custom board firmware</option>
            </select>
            <span class="inline-flex items-center px-3 text-sm border border-neutral rounded-e-0 rounded-s-md peer-focus/room_id:border-accent">
              <svg class="w-4 h-4" aria-hidden="true" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <title>Board model</title>
                <path
                  d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" />
              </svg>
            </span>
          </div>
        </div>

        <div id="firmware_dragdrop_target" class="py-4">
          <div class="flex items-center justify-center w-full">
            <label for="firmware" class="flex flex-col items-center justify-center w-full h-64 border-2 border-neutral hover:bg-base-300 border-dashed rounded-box cursor-pointer">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <span class="mdi mdi-cloud-upload-outline text-4xl"></span>
                    <p class="mb-2 text-sm"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                    <p id="save_new_firmware_modal_subtext" class="text-xs">.bin files</p>
                </div>
                <input id="firmware" name="firmware" type="file" accept=".bin" class="hidden" />
            </label>
          </div>
        </div>

        <div class="flex items-center justify-end space-x-2">
            <button type="button" class="btn btn-neutral" onclick="upload_firmware_modal.close();">Close</button>
            <button type="submit" id="firmware_upload_submit_button" class="btn btn-info btn-disabled">Upload</button>
        </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<!-- TFT Upload modal -->
<dialog id="upload_tft_modal" class="modal">
    <div class="modal-box">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <form method="POST" action="/nspanel_core/save_new_tft_file" enctype="multipart/form-data" data-authed>
          

          <h3 class="text-lg font-semibold mb-2">Upload TFT file</h3>

          <!-- TFT file type -->
          <div class="mt-4">
            <label for="tft_file_type" class="block mb-2 text-sm font-medium">TFT file type</label>
            <div class="flex flex-row-reverse">
              <select name="tft_file_type" id="tft_file_type" class="rounded-none bg-base-300 border-neutral rounded-e-md border border-l-0 focus:ring-0 focus:border-accent block flex-1 min-w-0 w-full text-sm p-2.5 peer/room_id">
                <option value="eu1">EU 1/US Landscape 1 (buttons left)</option>
                <option value="eu2">EU 2/US Landscape 2 (buttons left)</option>
                <option value="eu3">EU 3/US Landscape 3 (buttons left)</option>
                <option value="eu4">EU 4/US Landscape 4 (buttons left)</option>
                <option value="us1">US 1</option>
                <option value="us2">US 2</option>
                <option value="us3">US 3</option>
                <option value="us4">US 4</option>
                <option value="us1_horizontal_mirrored">US 1 (landscape mirrored)</option>
                <option value="us2_horizontal_mirrored">US 2 (landscape mirrored)</option>
                <option value="us3_horizontal_mirrored">US 3 (landscape mirrored)</option>
                <option value="us4_horizontal_mirrored">US 4 (landscape mirrored)</option>
              </select>
              <span class="inline-flex items-center px-3 text-sm border border-neutral rounded-e-0 rounded-s-md peer-focus/room_id:border-accent">
                <svg class="w-4 h-4" aria-hidden="true" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <title>TFT file type</title>
                  <path
                    d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" />
                </svg>
              </span>
            </div>
          </div>

          <div id="tft_dragdrop_target" class="py-4">
            <div class="flex items-center justify-center w-full">
              <label for="tft_file" class="flex flex-col items-center justify-center w-full h-64 border-2 border-neutral hover:bg-base-300 border-dashed rounded-box cursor-pointer">
                  <div class="flex flex-col items-center justify-center pt-5 pb-6">
                      <span class="mdi mdi-cloud-upload-outline text-4xl"></span>
                      <p class="mb-2 text-sm"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                      <p id="save_new_tft_file_modal_subtext" class="text-xs">.tft files</p>
                  </div>
                  <input id="tft_file" name="tft_file" type="file" accept=".tft" class="hidden" />
              </label>
            </div>
          </div>

          <div class="flex items-center justify-end space-x-2">
              <button type="button" class="btn btn-neutral" onclick="upload_tft_modal.close();">Close</button>
              <button type="submit" id="tft_upload_submit_button" class="btn btn-info btn-disabled">Upload</button>
          </div>
        </form>

    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<!-- Modal to indicate that we are loading something --->
<!-- This dialog will have the class htmx-request added to it when it's "active" --->
<dialog id="modal_loading" tabindex="-1" aria-hidden="true" class="modal z-50">
  <!-- Modal content -->
    <div class="modal-box">
        <!-- Modal header -->
        <h3 class="text-lg font-semibold mb-2">Loading</h3>

        <!-- Loader-->
        <div class="flex items-center justify-center">
            <span class="loading loading-ring loading-lg by-2"></span>
        </div>

    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<!-- Modal to confirm an action via HTMX -->
<dialog id="modal_confirm" tabindex="-1" aria-hidden="true" class="modal">
  <!-- Modal content -->
    <div class="modal-box">
        <!-- Modal header -->
        <h3 class="text-lg font-semibold mb-2">Confirm</h3>

        <!-- Loader-->
        <div class="">
            <span id="modal_confirm_text" class="">This is a sample confirm text?</span>
        </div>

        <div class="flex items-end justify-end gap-4 mt-4">
            <button id="modal_confirm_button" class="btn btn-success">OK</button>
            <button id="modal_confirm_cancel_button" class="btn btn-error">Cancel</button>
        </div>

    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
