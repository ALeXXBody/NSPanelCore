<script type="module">
  import { define, html } from '/nspanel_core/static/node_modules/hybrids/src/index.js?version={{ version }}';

  stomp_subscribe("nspanel/{{ nspanel.data.mac_address }}/status", (message) => {
    var element = document.getElementById(`nspanel-ram-status-{{ nspanel.data.id }}`);
    var data = JSON.parse(message.body);
    element.state = data.state;
    element.ram_usage = data.ram_usage;
  })

  define({
    tag: "nspanel-ram-status",
    nspanel_id: '',
    state: '',
    ram_usage: '',
    render: ({id, nspanel_id, state, ram_usage}) => {
      if (state == "offline" || state == "unknown") {
        return html`
           <div class="icon-text">
                <span class="icon me-1">
                    <i class="mdi mdi-memory"></i>
                </span>
                <span id="ram-${nspanel_id}" class="text-sm">?%</span>
            </div>
        `;
      } else {
        return html`
            <div class="icon-text">
                <span class="icon me-1">
                    <i class="mdi mdi-memory"></i>
                </span>
                <span id="ram-${nspanel_id}" class="text-sm">${ram_usage}%</span>
            </div>
        `;
      }
    },
  })
</script>

<nspanel-ram-status id="nspanel-ram-status-{{ nspanel.data.id }}" nspanel_id="{{ nspanel.data.id }}" state="" ram_usage=""></nspanel-ram-status>
