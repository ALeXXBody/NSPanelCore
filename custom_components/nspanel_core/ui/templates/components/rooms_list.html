<div id="rooms_table" hx-swap-oob="true">
    <table class="table">
        <thead class="">
            <tr>
                <th class="px-3 py-1 w-1"></th>
                <th class="px-3 py-1">Name</th>
                <th class="px-3 py-1">NSPanels</th>
            </tr>
        </thead>
        <tbody id="rooms_list">
                {% for room in rooms %}
                <tr class="hover bg-base-100 room-row" data-room-id="{{ room.room.id }}">
                    <td>
                        <span class="mdi mdi-drag-horizontal-variant cursor-grab sortable-handle" title="Drag and drop to reorder"></span>
                    </td>
                    <th class="">
                        <a href="/nspanel_core/rooms/{{ room.room.id }}">{{ room.room.friendly_name }}</a>
                    </th>
                    <td>
                        {% for nspanel in room.nspanels %}
                        <a href="/nspanel_core/rooms/{{ room.room.id }}">
                            {{ nspanel.status }}
                            
                        </a>
                        {% endfor %}
                    </td>
                </tr>
                {% endfor %}
        </tbody>
    </table>


    <!-- Only used to send what order the rooms should be in -->
    <form id="htmx_form_save_rooms_order" hx-post="/nspanel_core/htmx_partial_reorder_rooms" hx-swap="none" hx-indicator="#modal_loading" hx-trigger="reordered">
        <input type="hidden" name="htmx_form_save_rooms_order_field" id="htmx_form_save_rooms_order_field" value="">
    </form>

    <script>
    $(document).ready(() => {
        console.log("Attaching rooms sortable.");
        $("#rooms_list").sortable({
        handle: ".sortable-handle",
        update: (event, ui) => {
            // 'update' called ie. the order of elements in the DOM has changed.
            // Collect the ids ONCE and trigger the request once — the old
            // nested .each fired N identical POSTs per drag.
            var room_pages = {"rooms": []};
            $(".room-row").each((index, element) => {
                room_pages.rooms.push($(element).data('room-id'));
            });
            $("#htmx_form_save_rooms_order_field").val(JSON.stringify(room_pages));
            htmx.trigger(document.getElementById('htmx_form_save_rooms_order'), "reordered", {});
        }
        });
    });
    </script>
</div>
