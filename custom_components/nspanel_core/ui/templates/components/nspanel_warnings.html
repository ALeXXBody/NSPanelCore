<script type="module">
  import { define, html } from '/nspanel_core/static/vendor/hybrids/src/index.js?version={{ version }}';

  stomp_subscribe("nspanel/{{ nspanel.data.mac_address }}/status", (message) => {
    var element = document.getElementById(`nspanel-warnings-container-{{ nspanel.data.id }}`);
    var data = JSON.parse(message.body);
    element.state = data.state;
    element.warnings_string = JSON.stringify(data.warnings);
  })


  define({
    tag: "nspanel-warnings",
    nspanel_id: '',
    state: '',
    warnings_string: '',
    render: ({id, state, warnings_string}) => {
      if (state == "offline" || state == "unknown") {
        return html``;
      } else if(warnings_string.length > 0) {
        var warnings = JSON.parse(warnings_string);
        var alert_badge_color = "badge-info";
        var alert_border_color = "border-info";
        // Render each warning as a hybrids template with ${warning.text} in a
        // text position (escaped) — never pre-concatenate into innerHTML
        // (stored XSS via device-controlled warning text).
        var items = warnings.map(warning => {
          var cls = "alert alert-info my-1";
          var label = warning.text;
          if(warning.level == "error") {
            if(alert_badge_color == "badge-info" || alert_badge_color == "badge-warning") {
              alert_badge_color = "badge-error";
              alert_border_color = "border-error";
            }
            cls = "alert alert-error my-1";
          } else if(warning.level == "warning") {
            if(alert_badge_color == "badge-info") {
              alert_badge_color = "badge-warning";
              alert_border_color = "border-warning";
            }
            cls = "alert alert-warning my-1";
          } else if(warning.level == "info") {
            cls = "alert alert-info my-1";
          } else {
            cls = "alert alert-error my-1";
            label = "UNKNOWN LEVEL " + warning.level + " FOR WARNING: " + warning.text;
          }
          return html`<div role="alert" class=${cls}>${label}</div>`;
        });

        if (items.length > 0) {
          return html`
            <div class="mb-2" id="nspanel_warnings">
              ${items}
            </div>
          `;
        } else {
          // No warnings active, return empty
          return html``;
        }
      } else if (warnings_string.length == 0) {
        return html``;
      }
    },
  })
</script>


<nspanel-warnings id="nspanel-warnings-container-{{ nspanel.data.id }}"></nspanel-warnings>
